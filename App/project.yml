# XcodeGen spec for the iPhone app. CI turns it into FinanceiOS.xcodeproj; nobody edits the
# generated project by hand. Generated files (the .xcodeproj, Info.plist and .entitlements files)
# are not committed.
name: FinanceiOS
options:
  bundleIdPrefix: io.github.aspendot
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
packages:
  FinanceKit:
    path: ..
targets:
  Finance:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Finance
        excludes:
          - "Resources/**"
      - path: Finance/Resources
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: FinanceKit
        product: FinanceCore
      - package: FinanceKit
        product: FinanceSync
      - target: FinanceWidget
    info:
      path: Finance/Info.plist
      properties:
        CFBundleDisplayName: Finance
        # Enable full 120Hz ProMotion display pacing on supported iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # XcodeGen writes 1.0 and 1 unless told otherwise; SideStore checks both against its source.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The Documents folder shows up in Apple Devices on Windows and in Files, for the data file.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV Statement
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
        CFBundleURLTypes:
          - CFBundleURLName: io.github.aspendot.financeapp
            CFBundleURLSchemes:
              - financeapp
        NSFaceIDUsageDescription: Face ID keeps your finances private.
        NSCameraUsageDescription: Camera is used to scan receipts, payment slips, and the Drive sync pairing QR code.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [io.github.aspendot.financeapp.refresh]
        FinanceAppGroup: group.io.github.aspendot.financeapp
    entitlements:
      path: Finance/Finance.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.aspendot.financeapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aspendot.financeapp
        PRODUCT_NAME: Finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FinanceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FinanceWidget
      - path: Shared
    info:
      path: FinanceWidget/Info.plist
      properties:
        CFBundleDisplayName: Finance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FinanceAppGroup: group.io.github.aspendot.financeapp
    entitlements:
      path: FinanceWidget/FinanceWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.aspendot.financeapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aspendot.financeapp.widget
        PRODUCT_NAME: FinanceWidget
