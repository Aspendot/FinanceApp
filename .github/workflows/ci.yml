name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
      - name: Scan the full history
        run: |
          if [[ -e .gitleaksignore || -L .gitleaksignore ]]; then
            echo "Repository gitleaks ignore files are unsupported"
            exit 1
          fi
          gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow \
            --config tools/privacy/gitleaks.toml \
            --log-opts="--all --root --diff-merges=first-parent --no-ext-diff --no-textconv --text" .
      - name: Guard canary tests
        run: python3 -I tools/privacy/test_guard.py -v

  swift-linux:
    name: Swift tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test

  swift-macos:
    name: Swift tests (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test

  swift-windows:
    name: Swift tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.3 (digest-checked)
        shell: pwsh
        run: |
          $url = 'https://download.swift.org/swift-6.4.3-release/windows10/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE-windows10.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\swift.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\swift.exe" -Algorithm SHA256).Hash
          if ($hash -ne 'A4F1369833F77DE28DBAC998C8DEBE1C1D6044410DC6380238AE61A0D7CE5F77') { throw "Swift installer digest mismatch: $hash" }
          $p = Start-Process "$env:RUNNER_TEMP\swift.exe" -ArgumentList '/quiet', '/norestart', 'OptionsInstallAndroidPlatform=0' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Swift installer failed with exit code $($p.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          Add-Content $env:GITHUB_PATH (Join-Path $root 'Toolchains\6.4.3+Asserts\usr\bin')
          Add-Content $env:GITHUB_PATH (Join-Path $root 'Runtimes\6.4.3\usr\bin')
          Add-Content $env:GITHUB_ENV ('SDKROOT=' + (Join-Path $root 'Platforms\6.4.3\Windows.platform\Developer\SDKs\Windows.sdk\'))
      - run: swift --version
      - run: swift test
